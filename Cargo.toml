[workspace]
members = ["kernel", "user" ]
exclude = ["mkfs"]
resolver = "3"

[workspace.package]
version = "1.4.0"

[profile.release]
lto = true          # link time optimization, eleminates dead code
strip = true        # strips symbols from the binary
codegen-units = 1   # compile as one unit

[workspace.lints.clippy]
large_stack_arrays = "warn"
large_stack_frames = "warn"
